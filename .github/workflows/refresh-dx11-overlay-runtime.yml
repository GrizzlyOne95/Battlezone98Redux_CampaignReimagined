name: Refresh DX11 overlay runtime payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/dx11-overlay-deployment-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: fix/dx11-overlay-deployment-refresh
          fetch-depth: 0

      - name: Refresh runtime overlay files and add diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker_cpp = '// DX11 overlay deployment revision 2 - 2026-08-07 runtime refresh.\n'
          marker_lua = '-- DX11 overlay deployment revision 2 - 2026-08-07 runtime refresh.\n'

          cpp_files = [
              Path('Materials/CR_overlay.material'),
              Path('Materials/cr_pda_overlay.material'),
              Path('Shaders/CR_overlay.program'),
              Path('Shaders/CR_overlay-sm4.hlsl'),
          ]
          lua_files = [
              Path('Scripts/ScriptSubtitles.lua'),
              Path('Scripts/PersistentConfig.lua'),
          ]

          for p in cpp_files:
              s = p.read_text(encoding='utf-8')
              if 'DX11 overlay deployment revision 2' not in s:
                  p.write_text(marker_cpp + s, encoding='utf-8', newline='\n')

          for p in lua_files:
              s = p.read_text(encoding='utf-8')
              if 'DX11 overlay deployment revision 2' not in s:
                  p.write_text(marker_lua + s, encoding='utf-8', newline='\n')

          p = Path('Scripts/ScriptSubtitles.lua')
          s = p.read_text(encoding='utf-8')
          needle = '        Call(exu.SetOverlayMaterial, ids.text, OVERLAY_FONT_MATERIAL)\n'
          diagnostic = needle + '        SubtitleLog("DX11 overlay text material rebound to " .. tostring(OVERLAY_FONT_MATERIAL))\n'
          if needle not in s:
              raise SystemExit('ScriptSubtitles.lua: expected overlay material rebind not found')
          if 'DX11 overlay text material rebound to' not in s:
              s = s.replace(needle, diagnostic, 1)
              p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('Scripts/PersistentConfig.lua')
          s = p.read_text(encoding='utf-8')
          needle = '''        for _, textId in ipairs(textIds) do
            if textId then
                SafeCall(exu.SetOverlayMaterial, textId, "CR_OverlayFont")
            end
        end
'''
          diagnostic = needle + '        Log(string.format("PersistentConfig: PDA overlay text materials rebound kind=%s material=CR_OverlayFont", tostring(kind)))\n'
          if needle not in s:
              raise SystemExit('PersistentConfig.lua: expected PDA overlay material rebind not found')
          if 'PDA overlay text materials rebound kind=' not in s:
              s = s.replace(needle, diagnostic, 1)
              p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Verify refresh payload
        shell: bash
        run: |
          grep -q 'DX11 overlay deployment revision 2' Materials/CR_overlay.material
          grep -q 'DX11 overlay deployment revision 2' Materials/cr_pda_overlay.material
          grep -q 'DX11 overlay deployment revision 2' Shaders/CR_overlay.program
          grep -q 'DX11 overlay deployment revision 2' Shaders/CR_overlay-sm4.hlsl
          grep -q 'DX11 overlay deployment revision 2' Scripts/ScriptSubtitles.lua
          grep -q 'DX11 overlay deployment revision 2' Scripts/PersistentConfig.lua
          grep -q 'DX11 overlay text material rebound to' Scripts/ScriptSubtitles.lua
          grep -q 'PDA overlay text materials rebound kind=' Scripts/PersistentConfig.lua

      - name: Commit runtime refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- \
            Materials/CR_overlay.material \
            Materials/cr_pda_overlay.material \
            Shaders/CR_overlay.program \
            Shaders/CR_overlay-sm4.hlsl \
            Scripts/ScriptSubtitles.lua \
            Scripts/PersistentConfig.lua
          if git diff --cached --quiet; then
            echo 'Overlay deployment refresh already present.'
            exit 0
          fi
          git commit -m 'Refresh DX11 overlay runtime payload'
          git push origin HEAD:fix/dx11-overlay-deployment-refresh
