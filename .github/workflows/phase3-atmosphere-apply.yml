name: Apply DX11 Enhanced Atmosphere Phase 3

on:
  push:
    branches:
      - agent/dx11-enhanced-atmosphere-phase3
    paths:
      - .github/workflows/phase3-atmosphere-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dx11-enhanced-atmosphere-phase3
          fetch-depth: 0

      - name: Apply atmospheric rendering implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          diagnostic_old = '''// TEMPORARY DIAGNOSTIC: when enabled, any pixel using the static IBL path is
          // strongly tinted magenta after normal lighting/fog. Remove after runtime proof.
          #ifndef CR_IBL_DEBUG_VISUALIZE
          #define CR_IBL_DEBUG_VISUALIZE 0
          #endif
          '''

          diagnostic_new = '''// Compile-time atmosphere diagnostics. Runtime builds leave this disabled.
          // 0 = normal rendering, 1 = total fog, 2 = height contribution,
          // 3 = sun scattering, 4 = resolved atmosphere colour.
          #ifndef CR_ATMOS_DEBUG_MODE
          #define CR_ATMOS_DEBUG_MODE 0
          #endif
          '''

          for shader in ('Shaders/CR_base-sm4.hlsl', 'Shaders/CR_terrain-sm4.hlsl'):
              replace_once(shader, diagnostic_old, diagnostic_new)

          atmos_helpers = '''static const float CR_IBL_MAX_SPECULAR_MIP = 7.0;

          // -----------------------------------------------------------------------------
          // DX11 Enhanced Atmospheric Calibration
          // -----------------------------------------------------------------------------
          // Ogre fog_params are consumed as density/start/end/inverse-range. Enhanced
          // atmosphere deliberately preserves start/end/range as the authored mission
          // control instead of replacing them with one global density.
          static const float CR_ATMOS_DISTANCE_DENSITY_SCALE = 1.65;
          static const float CR_ATMOS_HEIGHT_FALLOFF = 0.0035;
          static const float CR_ATMOS_HEIGHT_STRENGTH = 0.22;
          static const float CR_ATMOS_HORIZON_STRENGTH = 0.18;
          static const float CR_ATMOS_HORIZON_POWER = 3.0;
          static const float CR_ATMOS_SUN_SCATTER_POWER = 7.0;
          static const float CR_ATMOS_SUN_SCATTER_STRENGTH = 0.28;
          static const float CR_ATMOS_AMBIENT_TINT_STRENGTH = 0.16;
          static const float CR_ATMOS_SUN_TINT_STRENGTH = 0.28;
          static const float CR_ATMOS_AERIAL_DESATURATION = 0.08;
          static const float CR_ATMOS_EMISSIVE_TRANSMISSION = 0.38;
          static const float CR_ATMOS_MAX_OPTICAL_DEPTH = 12.0;

          float compute_distance_optical_depth(float viewDistance, float4 fogParams)
          {
              float fogStart = max(fogParams.y, 0.0);
              float fogEnd = max(fogParams.z, fogStart);
              float authoredRange = max(fogEnd - fogStart, 1e-3);
              float suppliedInvRange = abs(fogParams.w);
              float invRange = (suppliedInvRange > 1e-8) ? suppliedInvRange : rcp(authoredRange);
              invRange = min(invRange, 1e3);

              // A zero inverse range is how the legacy path effectively disables fog.
              // Keep that as the atmosphere master-strength signal for airless/light-fog maps.
              float configured = (fogEnd > fogStart + 1e-3 && suppliedInvRange > 1e-8) ? 1.0 : 0.0;
              float normalizedTravel = max(viewDistance - fogStart, 0.0) * invRange;
              float scaledTravel = min(normalizedTravel * CR_ATMOS_DISTANCE_DENSITY_SCALE, 4.0);
              return min(scaledTravel * scaledTravel, CR_ATMOS_MAX_OPTICAL_DEPTH) * configured;
          }

          float compute_height_density(float cameraRelativeWorldHeight)
          {
              // Full Enhanced High uses a camera-relative world-space height delta. This
              // avoids subtracting huge absolute coordinates on Battlezone's large maps.
              float exponent = clamp(-cameraRelativeWorldHeight * CR_ATMOS_HEIGHT_FALLOFF, -1.5, 1.5);
              return exp(exponent);
          }

          float compute_horizon_factor(float3 worldViewRay)
          {
              float horizon = saturate(1.0 - abs(worldViewRay.y));
              return pow(horizon, CR_ATMOS_HORIZON_POWER);
          }

          void compute_sun_scattering(
              float3 viewRay,
              float4 primaryLightPosition,
              float3 primaryLightDiffuse,
              float lightCount,
              float horizonFactor,
              out float sunScatter,
              out float3 sunTint)
          {
              sunScatter = 0.0;
              sunTint = float3(1.0, 1.0, 1.0);

              // The existing lighting convention uses lightPosition.xyz directly when
              // w == 0, so only that established directional-light form may drive haze.
              if (lightCount <= 0.0 || abs(primaryLightPosition.w) >= 0.5)
                  return;

              float3 sunDirection = safe_normalize(primaryLightPosition.xyz);
              if (dot(sunDirection, sunDirection) <= 1e-8)
                  return;

              float forward = pow(saturate(dot(viewRay, sunDirection)), CR_ATMOS_SUN_SCATTER_POWER);
              float peak = max(primaryLightDiffuse.r, max(primaryLightDiffuse.g, primaryLightDiffuse.b));
              if (peak > 1e-4)
                  sunTint = saturate(primaryLightDiffuse / peak);

              sunScatter = forward * (0.60 + 0.40 * horizonFactor);
          }

          void compute_enhanced_atmosphere(
              float3 viewPosition,
              float4 fogParams,
              float3 fogColour,
              float3 sceneAmbient,
              float4 primaryLightPosition,
              float3 primaryLightDiffuse,
              float lightCount,
              float cameraRelativeWorldHeight,
              float horizonFactor,
              out float fogFactor,
              out float heightContribution,
              out float sunScatter,
              out float3 atmosphereColour,
              out float surfaceTransmission,
              out float emissiveTransmission)
          {
              float viewDistance = max(length(viewPosition), 0.0);
              float distanceOpticalDepth = compute_distance_optical_depth(viewDistance, fogParams);

              float heightDensity = compute_height_density(cameraRelativeWorldHeight);
              float heightScale = lerp(1.0, heightDensity, CR_ATMOS_HEIGHT_STRENGTH);
              heightContribution = saturate(abs(heightScale - 1.0) * 2.0);

              float densityScale = max(heightScale + horizonFactor * CR_ATMOS_HORIZON_STRENGTH, 0.25);
              float opticalDepth = min(distanceOpticalDepth * densityScale, CR_ATMOS_MAX_OPTICAL_DEPTH);
              surfaceTransmission = exp(-opticalDepth);
              fogFactor = saturate(1.0 - surfaceTransmission);

              float3 viewRay = safe_normalize(viewPosition);
              float3 sunTint;
              compute_sun_scattering(
                  viewRay,
                  primaryLightPosition,
                  primaryLightDiffuse,
                  lightCount,
                  horizonFactor,
                  sunScatter,
                  sunTint);
              sunScatter *= fogFactor;

              float3 authoredFog = saturate(fogColour);
              float3 ambientTarget = saturate(authoredFog + sceneAmbient * 0.35);
              atmosphereColour = lerp(authoredFog, ambientTarget, CR_ATMOS_AMBIENT_TINT_STRENGTH);
              float sunBlend = saturate(sunScatter * CR_ATMOS_SUN_SCATTER_STRENGTH);
              float3 sunwardAtmosphere = saturate(atmosphereColour + sunTint * CR_ATMOS_SUN_TINT_STRENGTH);
              atmosphereColour = lerp(atmosphereColour, sunwardAtmosphere, sunBlend);

              // Emission still extinguishes with distance, but less aggressively than
              // reflected surface light so engines/panels remain legible through haze.
              float softenedTransmission = sqrt(saturate(surfaceTransmission));
              emissiveTransmission = lerp(
                  surfaceTransmission,
                  softenedTransmission,
                  CR_ATMOS_EMISSIVE_TRANSMISSION);
          }
          '''

          replace_once(
              'Shaders/CR_base-sm4.hlsl',
              'static const float CR_IBL_MAX_SPECULAR_MIP = 7.0;\n',
              atmos_helpers)
          replace_once(
              'Shaders/CR_terrain-sm4.hlsl',
              'static const float CR_IBL_MAX_SPECULAR_MIP = 7.0;\n',
              atmos_helpers)

          base_old = '''    float4 diffuseTex = diffuseMap.Sample(diffuseSam, vTexCoord);
              oColor.xyz = lightResult.xyz * diffuseTex.xyz * diffuseColor.xyz;

          #if defined(SPECULAR_ENABLED) || defined(SPECULARMAP_ENABLED)
              oColor.xyz += specularResult.xyz;
          #endif

          #if defined(EMISSIVEMAP_ENABLED)
              float3 emissiveTex = emissiveMap.Sample(emissiveSam, vTexCoord).xyz;
          #if defined(ENHANCED_MODE)
              // Preserve the legacy full-bright map at High LOD. The material emissive
              // colour may boost authored emission, but must never attenuate it below
              // the Medium/Low/Lowest behavior (which adds the map at 1.0x).
              float materialEmissiveIntensity = max(materialEmissive.x, max(materialEmissive.y, materialEmissive.z));
              float emissiveIntensity = max(1.0, materialEmissiveIntensity);
              oColor.xyz += emissiveTex.xyz * emissiveIntensity;
          #else
              oColor.xyz += emissiveTex.xyz;
          #endif
          #endif

              float fogValue = saturate((vDepth - fogParams.y) * fogParams.w);
              oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);

          #if defined(IBL_ENABLED) && CR_IBL_DEBUG_VISUALIZE
              // TEMP IBL DEBUG MARKER: unmistakable proof that the Enhanced-High IBL
              // shader variant is actually drawing this pixel.
              oColor.xyz = lerp(oColor.xyz, float3(1.0, 0.0, 1.0), 0.85);
          #endif
          '''

          base_new = '''    float4 diffuseTex = diffuseMap.Sample(diffuseSam, vTexCoord);
              oColor.xyz = lightResult.xyz * diffuseTex.xyz * diffuseColor.xyz;

          #if defined(SPECULAR_ENABLED) || defined(SPECULARMAP_ENABLED)
              oColor.xyz += specularResult.xyz;
          #endif

              float3 emissiveContribution = float3(0.0, 0.0, 0.0);
          #if defined(EMISSIVEMAP_ENABLED)
              float3 emissiveTex = emissiveMap.Sample(emissiveSam, vTexCoord).xyz;
          #if defined(ENHANCED_MODE)
              // Preserve the legacy full-bright map at High LOD. The material emissive
              // colour may boost authored emission, but must never attenuate it below
              // the Medium/Low/Lowest behavior (which adds the map at 1.0x).
              float materialEmissiveIntensity = max(materialEmissive.x, max(materialEmissive.y, materialEmissive.z));
              float emissiveIntensity = max(1.0, materialEmissiveIntensity);
              emissiveContribution = emissiveTex.xyz * emissiveIntensity;
          #else
              oColor.xyz += emissiveTex.xyz;
          #endif
          #endif

          #if defined(ENHANCED_MODE) && !defined(VERTEX_LIGHTING)
              // Enhanced atmosphere is deliberately post-BRDF/post-IBL. Non-IBL
              // Enhanced delegates use the same exponential/aerial model; IBL High
              // additionally supplies stable camera-relative world height and horizon.
              float cameraRelativeWorldHeight = 0.0;
              float horizonFactor = 0.0;
          #if defined(IBL_ENABLED)
              float3 cameraRelativeWorldPosition = mul(inverseViewMatrix, float4(viewPos, 0.0)).xyz;
              float3 worldViewRay = safe_normalize(mul(inverseViewMatrix, float4(safe_normalize(viewPos), 0.0)).xyz);
              cameraRelativeWorldHeight = cameraRelativeWorldPosition.y;
              horizonFactor = compute_horizon_factor(worldViewRay);
          #endif

              float fogValue;
              float heightContribution;
              float sunScatter;
              float3 atmosphereColour;
              float surfaceTransmission;
              float emissiveTransmission;
              compute_enhanced_atmosphere(
                  viewPos,
                  fogParams,
                  fogColour.xyz,
                  sceneAmbient.xyz,
                  lightPosition[0],
                  lightDiffuse[0].xyz,
                  lightCount,
                  cameraRelativeWorldHeight,
                  horizonFactor,
                  fogValue,
                  heightContribution,
                  sunScatter,
                  atmosphereColour,
                  surfaceTransmission,
                  emissiveTransmission);

              float surfaceLuminance = luminance_legacy(oColor.xyz);
              float3 aerialSurface = lerp(
                  oColor.xyz,
                  float3(surfaceLuminance, surfaceLuminance, surfaceLuminance),
                  fogValue * CR_ATMOS_AERIAL_DESATURATION);
              oColor.xyz = aerialSurface * surfaceTransmission
                         + atmosphereColour * fogValue
                         + emissiveContribution * emissiveTransmission;

          #if CR_ATMOS_DEBUG_MODE == 1
              oColor.xyz = float3(fogValue, fogValue, fogValue);
          #elif CR_ATMOS_DEBUG_MODE == 2
              oColor.xyz = float3(heightContribution, heightContribution, heightContribution);
          #elif CR_ATMOS_DEBUG_MODE == 3
              oColor.xyz = float3(sunScatter, sunScatter, sunScatter);
          #elif CR_ATMOS_DEBUG_MODE == 4
              oColor.xyz = atmosphereColour;
          #endif
          #else
          #if defined(ENHANCED_MODE) && defined(EMISSIVEMAP_ENABLED)
              // Safety fallback for any unexpected Enhanced vertex-lighting delegate.
              emissiveContribution = emissiveContribution;
              oColor.xyz += emissiveContribution;
          #endif
              float fogValue = saturate((vDepth - fogParams.y) * fogParams.w);
              oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);
          #endif
          '''

          replace_once('Shaders/CR_base-sm4.hlsl', base_old, base_new)

          terrain_old = '''    float4 diffuseTex = diffuseMap.Sample(diffuseSam, vTexCoord);
              oColor.xyz = lightResult.xyz * vColor.xyz * diffuseTex.xyz;

          #if defined(SPECULAR_ENABLED) || defined(SPECULARMAP_ENABLED)
              oColor.xyz += specularResult.xyz;
          #endif

          #if defined(EMISSIVEMAP_ENABLED)
              float3 emissiveTex = emissiveMap.Sample(emissiveSam, vTexCoord).xyz;
              oColor.xyz += emissiveTex.xyz;
          #endif

          #if defined(DETAILMAP_ENABLED)
              float3 detailTex = detailMap.Sample(detailSam, frac(vTexCoord * 8.0)).xyz * 2.0;
              float3 fullbrightDetail = float3(1.0, 1.0, 1.0);
          #if defined(ENHANCED_MODE)
              float detailDistance = saturate(vDepth * 0.015);
              float3 detailColor = lerp(detailTex, fullbrightDetail, detailDistance);
              float3 detailTexNear = detailMap.Sample(detailSam, frac(vTexCoord * 32.0)).xyz * 2.0;
              float detailNearFade = saturate(vDepth * 0.08);
              detailColor *= lerp(lerp(detailTexNear, fullbrightDetail, 0.5), fullbrightDetail, detailNearFade);
          #else
              float detailDistance = saturate(vDepth * 0.025);
              float3 detailColor = lerp(detailTex, fullbrightDetail, detailDistance);
          #endif
          #if defined(OG_RETRO_MODE)
              oColor.xyz = lerp(oColor.xyz, oColor.xyz * detailColor, diffuseTex.a * 0.35);
          #else
              oColor.xyz = lerp(oColor.xyz, oColor.xyz * detailColor, diffuseTex.a);
          #endif
          #endif

              float fogValue = saturate((vDepth - fogParams.y) * fogParams.w);
              oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);

          #if defined(IBL_ENABLED) && CR_IBL_DEBUG_VISUALIZE
              // TEMP IBL DEBUG MARKER: unmistakable proof that the Enhanced-High IBL
              // shader variant is actually drawing this pixel.
              oColor.xyz = lerp(oColor.xyz, float3(1.0, 0.0, 1.0), 0.85);
          #endif
          '''

          terrain_new = '''    float4 diffuseTex = diffuseMap.Sample(diffuseSam, vTexCoord);
              oColor.xyz = lightResult.xyz * vColor.xyz * diffuseTex.xyz;

          #if defined(SPECULAR_ENABLED) || defined(SPECULARMAP_ENABLED)
              oColor.xyz += specularResult.xyz;
          #endif

              float3 emissiveContribution = float3(0.0, 0.0, 0.0);
          #if defined(EMISSIVEMAP_ENABLED)
              float3 emissiveTex = emissiveMap.Sample(emissiveSam, vTexCoord).xyz;
          #if defined(ENHANCED_MODE)
              emissiveContribution = emissiveTex.xyz;
          #else
              oColor.xyz += emissiveTex.xyz;
          #endif
          #endif

          #if defined(DETAILMAP_ENABLED)
              float3 detailTex = detailMap.Sample(detailSam, frac(vTexCoord * 8.0)).xyz * 2.0;
              float3 fullbrightDetail = float3(1.0, 1.0, 1.0);
          #if defined(ENHANCED_MODE)
              float detailDistance = saturate(vDepth * 0.015);
              float3 detailColor = lerp(detailTex, fullbrightDetail, detailDistance);
              float3 detailTexNear = detailMap.Sample(detailSam, frac(vTexCoord * 32.0)).xyz * 2.0;
              float detailNearFade = saturate(vDepth * 0.08);
              detailColor *= lerp(lerp(detailTexNear, fullbrightDetail, 0.5), fullbrightDetail, detailNearFade);
          #else
              float detailDistance = saturate(vDepth * 0.025);
              float3 detailColor = lerp(detailTex, fullbrightDetail, detailDistance);
          #endif
          #if defined(OG_RETRO_MODE)
              float3 detailMultiplier = lerp(float3(1.0, 1.0, 1.0), detailColor, diffuseTex.a * 0.35);
          #else
              float3 detailMultiplier = lerp(float3(1.0, 1.0, 1.0), detailColor, diffuseTex.a);
          #endif
              oColor.xyz *= detailMultiplier;
          #if defined(ENHANCED_MODE)
              // Keep pre-atmosphere terrain emissive behavior identical to the old
              // combined-color detail multiply before applying reduced extinction.
              emissiveContribution *= detailMultiplier;
          #endif
          #endif

          #if defined(ENHANCED_MODE) && !defined(VERTEX_LIGHTING)
              float cameraRelativeWorldHeight = 0.0;
              float horizonFactor = 0.0;
          #if defined(IBL_ENABLED)
              float3 cameraRelativeWorldPosition = mul(inverseViewMatrix, float4(viewPos, 0.0)).xyz;
              float3 worldViewRay = safe_normalize(mul(inverseViewMatrix, float4(safe_normalize(viewPos), 0.0)).xyz);
              cameraRelativeWorldHeight = cameraRelativeWorldPosition.y;
              horizonFactor = compute_horizon_factor(worldViewRay);
          #endif

              float fogValue;
              float heightContribution;
              float sunScatter;
              float3 atmosphereColour;
              float surfaceTransmission;
              float emissiveTransmission;
              compute_enhanced_atmosphere(
                  viewPos,
                  fogParams,
                  fogColour.xyz,
                  sceneAmbient.xyz,
                  lightPosition[0],
                  lightDiffuse[0].xyz,
                  lightCount,
                  cameraRelativeWorldHeight,
                  horizonFactor,
                  fogValue,
                  heightContribution,
                  sunScatter,
                  atmosphereColour,
                  surfaceTransmission,
                  emissiveTransmission);

              float surfaceLuminance = luminance_legacy(oColor.xyz);
              float3 aerialSurface = lerp(
                  oColor.xyz,
                  float3(surfaceLuminance, surfaceLuminance, surfaceLuminance),
                  fogValue * CR_ATMOS_AERIAL_DESATURATION);
              oColor.xyz = aerialSurface * surfaceTransmission
                         + atmosphereColour * fogValue
                         + emissiveContribution * emissiveTransmission;

          #if CR_ATMOS_DEBUG_MODE == 1
              oColor.xyz = float3(fogValue, fogValue, fogValue);
          #elif CR_ATMOS_DEBUG_MODE == 2
              oColor.xyz = float3(heightContribution, heightContribution, heightContribution);
          #elif CR_ATMOS_DEBUG_MODE == 3
              oColor.xyz = float3(sunScatter, sunScatter, sunScatter);
          #elif CR_ATMOS_DEBUG_MODE == 4
              oColor.xyz = atmosphereColour;
          #endif
          #else
          #if defined(ENHANCED_MODE) && defined(EMISSIVEMAP_ENABLED)
              oColor.xyz += emissiveContribution;
          #endif
              float fogValue = saturate((vDepth - fogParams.y) * fogParams.w);
              oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);
          #endif
          '''

          replace_once('Shaders/CR_terrain-sm4.hlsl', terrain_old, terrain_new)

          validator_marker = '''    @{
                  Name = 'base-ps-retro'
                  File = $baseShader
                  Entry = 'base_fragment'
                  Target = 'ps_4_0'
                  Defines = @('MAX_LIGHTS=8', 'OG_RETRO_MODE=1', 'RETRO_UNLIT_MODE=1')
              },
          '''
          validator_insert = '''    @{
                  Name = 'base-ps-atmos-debug-colour'
                  File = $baseShader
                  Entry = 'base_fragment'
                  Target = 'ps_4_0'
                  Defines = @('MAX_LIGHTS=24', 'NORMALMAP_ENABLED=1', 'SPECULARMAP_ENABLED=1', 'EMISSIVEMAP_ENABLED=1', 'ENHANCED_MODE=1', 'IBL_ENABLED=1', 'SHADOWRECEIVER=1', 'PSSM_ENABLED=1', 'PCF_SIZE=4', 'CR_ATMOS_DEBUG_MODE=4')
              },
          ''' + validator_marker
          replace_once('Tools/Validate-DX11Shaders.ps1', validator_marker, validator_insert)

          terrain_validator_marker = '''    @{
                  Name = 'terrain-ps-retro'
                  File = $terrainShader
                  Entry = 'terrain_fragment'
                  Target = 'ps_4_0'
                  Defines = @('MAX_LIGHTS=8', 'DETAILMAP_ENABLED=1', 'OG_RETRO_MODE=1', 'RETRO_UNLIT_MODE=1')
              }
          '''
          terrain_validator_insert = '''    @{
                  Name = 'terrain-ps-atmos-debug-height'
                  File = $terrainShader
                  Entry = 'terrain_fragment'
                  Target = 'ps_4_0'
                  Defines = @('MAX_LIGHTS=24', 'DETAILMAP_ENABLED=1', 'NORMALMAP_ENABLED=1', 'SPECULARMAP_ENABLED=1', 'EMISSIVEMAP_ENABLED=1', 'ENHANCED_MODE=1', 'IBL_ENABLED=1', 'CR_ATMOS_DEBUG_MODE=2')
              },
          ''' + terrain_validator_marker
          replace_once('Tools/Validate-DX11Shaders.ps1', terrain_validator_marker, terrain_validator_insert)

          docs = r'''# DX11 Enhanced Phase 3 — Atmospheric Rendering

          Phase 3 replaces the simple linear fog presentation in the DX11 Enhanced per-pixel shader path with an analytic atmospheric model. DX9, OpenGL, OG Retro, non-Enhanced, and vertex-lighting compatibility behavior remains on the legacy fog path.

          ## What changed

          - Camera-distance exponential-squared extinction driven by the existing Ogre `fog_params` start/end/inverse-range values.
          - Scene-aware aerial perspective using mission `fogColour`, `sceneAmbient`, and the primary directional light colour.
          - Subtle forward sun scattering, only when light 0 uses the engine's established directional-light convention (`lightPosition[0].w == 0`).
          - Enhanced High + static IBL adds camera-relative world-height density and horizon haze using the already-bound `inverseViewMatrix`.
          - Emissive maps are separated from reflected surface lighting during the final atmosphere step and use reduced, not bypassed, extinction.
          - Terrain detail multiplication remains equivalent before atmosphere, preserving the existing rough-dielectric terrain tuning and emissive behavior.
          - The obsolete temporary magenta IBL visualization was removed. `CR_ATMOS_DEBUG_MODE` provides focused atmosphere diagnostics and is disabled by default.

          ## Mission fog interaction

          Ogre supplies fog parameters as density/start/end/inverse-range. The Enhanced model treats start/end/inverse-range as the authored mission identity:

          1. No extinction occurs before the authored start distance.
          2. Distance after the start is normalized by the authored inverse range.
          3. That normalized travel becomes a bounded exponential-squared optical depth.
          4. Height/horizon terms only modulate that optical depth; they cannot create atmosphere when the mission fog range is effectively disabled.

          This means light-fog and airless missions stay restrained, while intentionally heavy-fog missions remain heavy.

          ## Calibration constants

          The `DX11 Enhanced Atmospheric Calibration` block is duplicated intentionally in `CR_base-sm4.hlsl` and `CR_terrain-sm4.hlsl` to avoid a larger include-architecture refactor.

          - `CR_ATMOS_DISTANCE_DENSITY_SCALE = 1.65` — maps authored fog range into exponential-squared optical depth.
          - `CR_ATMOS_HEIGHT_FALLOFF = 0.0035` — sensitivity to camera-relative vertical displacement.
          - `CR_ATMOS_HEIGHT_STRENGTH = 0.22` — keeps valley/elevation effects subtle.
          - `CR_ATMOS_HORIZON_STRENGTH = 0.18` / `CR_ATMOS_HORIZON_POWER = 3.0` — broad, band-free horizon haze.
          - `CR_ATMOS_SUN_SCATTER_POWER = 7.0` — forward lobe width.
          - `CR_ATMOS_SUN_SCATTER_STRENGTH = 0.28` — limits sunward haze influence.
          - `CR_ATMOS_AMBIENT_TINT_STRENGTH = 0.16` — conservatively mixes scene ambient into authored fog colour.
          - `CR_ATMOS_SUN_TINT_STRENGTH = 0.28` — allows the directional light to colour, not replace, mission haze.
          - `CR_ATMOS_AERIAL_DESATURATION = 0.08` — small distance saturation loss before extinction.
          - `CR_ATMOS_EMISSIVE_TRANSMISSION = 0.38` — blends normal transmission toward square-root transmission for emissives.
          - `CR_ATMOS_MAX_OPTICAL_DEPTH = 12.0` — numerical guard for extreme map distances.

          ## Quality tiers

          - **Enhanced High + IBL:** full model: exponential distance fog, height density, horizon haze, aerial perspective, sun scattering, and emissive-aware extinction.
          - **Other Enhanced SM4 per-pixel tiers:** exponential distance fog, aerial perspective, sun scattering, and emissive-aware extinction. Height and world-horizon terms remain neutral because those delegates do not currently bind `inverseViewMatrix`.
          - **Vertex-lighting fallback, OG Retro, and non-Enhanced:** unchanged legacy linear fog.

          No new material/program binding was required: `CR_static_ibl.program` already binds `inverseViewMatrix` for all three Enhanced High IBL DX11 variants, and the existing unified program already supplies fog, ambient, and light arrays.

          ## Known limitations

          - Height fog is camera-relative rather than tied to an absolute world sea level. This is deliberate: it avoids large-coordinate precision problems and does not require engine hooks or new mission parameters. Low terrain below the camera becomes slightly denser; elevated terrain becomes slightly clearer.
          - Only the primary light can contribute atmospheric sun scattering, and only when it is represented as a directional light. Point and spot lights never drive atmosphere.
          - This is an analytic forward-shader approximation. It does not ray march, sample the framebuffer/depth buffer, render volumetrics, or add HDR/bloom/SSR/SSAO.

          ## Debug visualization

          Set `CR_ATMOS_DEBUG_MODE` at compile time:

          - `0` normal rendering
          - `1` total fog factor
          - `2` height contribution
          - `3` sun scattering contribution
          - `4` resolved atmosphere colour

          ## Runtime test checklist

          - [ ] DX11 Enhanced High
          - [ ] IBL active
          - [ ] PSSM active
          - [ ] no-shadow path
          - [ ] terrain broad sightlines and horizon
          - [ ] vehicles and buildings
          - [ ] emissive engines, panels, and building lights at near/mid/far distance
          - [ ] light-fog or near-airless map remains restrained
          - [ ] heavy authored fog map remains heavy
          - [ ] sun-facing horizon gains subtle brighter haze without a fake sun disk
          - [ ] sun-away view remains primarily `fogColour`/ambient-driven
          - [ ] elevated camera/terrain shows slightly reduced haze
          - [ ] low valley terrain shows slightly increased haze
          - [ ] terrain remains rough/dry; no return of wet/varnished IBL highlights
          - [ ] Retro mode comparison is visually unchanged
          - [ ] no-shadow, single-shadow, and PSSM variants render without shader errors
          - [ ] very large view distances remain stable with logarithmic depth enabled
          '''
          Path('Docs/DX11_Enhanced_Phase3_Atmosphere.md').write_text(docs.strip() + '\n', encoding='utf-8')

          # Remove the one-shot workflow from the resulting branch diff.
          Path('.github/workflows/phase3-atmosphere-apply.yml').unlink()
          PY

