name: Campaign Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate campaign content
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          # Full history lets the validator identify Lua files changed by the
          # PR/push and enforce Lua 5.1 strictly on newly touched mission code.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua 5.1 compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          command -v luac5.1 || command -v luac

      - name: Validate repository invariants
        run: python Tools/Validate-CampaignRepository.py

      - name: Test BlackDog09 source port
        run: |
          lua5.1 Tools/Test-BlackDog09.lua
          python Tools/Test-BlackDog09SourceParity.py

      - name: Test misn12 source port and Lua comment scanning
        run: |
          lua5.1 Tools/Test-Misn12.lua
          python Tools/Test-LuaCommentScan.py

      - name: Check generated GoombaBZ transcripts
        run: python Tools/Import-GoombaTranscripts.py --check

      - name: Report legacy Lua 5.1 compatibility debt
        shell: bash
        run: |
          set -uo pipefail
          LUAC="$(command -v luac5.1 || command -v luac)"
          failed=0
          while IFS= read -r -d '' file; do
            output=""
            if ! output="$($LUAC -p "$file" 2>&1)"; then
              # BZR inherits Lua 5.1's 60-upvalue ceiling. Existing legacy
              # offenders remain visible while they are repaired in focused PRs;
              # all other compiler failures are blocking immediately.
              if grep -Fq "has more than 60 upvalues" <<<"$output"; then
                echo "::warning file=$file::$output"
              else
                echo "$output" >&2
                failed=1
              fi
            fi
          done < <(find Scripts Missions -type f -iname '*.lua' -print0 2>/dev/null || true)
          exit "$failed"

      - name: Test OpenShim installer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-OpenShimInstallerDiagnostics.lua

      - name: Test CR co-op helpers
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-CRCoop.lua
          "$LUA" Tools/Test-CRWire.lua
          "$LUA" Tools/Test-CRCoopComms.lua
          "$LUA" Tools/Test-CRCoopAssist.lua
          "$LUA" Tools/Test-CRCoopPda.lua
          "$LUA" Tools/Test-CRCoopDiagnostics.lua
          "$LUA" Tools/Test-CoopNetworkInput.lua
          "$LUA" Tools/Test-SubtitleReplacement.lua

      - name: Test misn02b co-op map and shipping contract
        run: python Tools/Test-Misn02bCoopContract.py

      - name: Test misn02b co-op execution and peer transport model
        run: |
          lua5.1 Tools/Test-BZRPeerTransport.lua
          lua5.1 Tools/Test-Misn02bCoop.lua

      - name: Test misn03 co-op team contract
        run: python Tools/Test-Misn03CoopContract.py

      - name: Test misn03 offline and co-op mission execution
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn03Coop.lua

      - name: Test misn04 co-op scaffold and complete mission
        run: |
          python Tools/Test-Misn04CoopContract.py
          lua5.1 Tools/Test-Misn04Coop.lua

      - name: Test misn10 source-faithful port
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn10.lua
          python Tools/Test-Misn10SourceParity.py

      - name: Test misn11 source port, co-op layer and presentation
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn11.lua
          "$LUA" Tools/Test-Misn11Coop.lua
          "$LUA" Tools/Test-Misn11Presentation.lua
          python Tools/Test-Misn11SourceParity.py
          python Tools/Test-Misn11CoopContract.py
          python Tools/Test-CoopAuthoredLabels.py

      - name: Test misn12 source port, co-op layer, presentation and Europa weather
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn12.lua
          "$LUA" Tools/Test-Misn12Coop.lua
          "$LUA" Tools/Test-Misn12Presentation.lua
          "$LUA" Tools/Test-CREuropaWeather.lua
          python Tools/Test-Misn12SourceParity.py
          python Tools/Test-Misn12CoopContract.py

      # CR Moon weather >>
      - name: Test Moon weather director (misn02b / misn03)
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-CRMoonWeather.lua Scripts
          # The generated map data must match what the generator produces from the shipped terrain.
          python -I Tools/Build-MoonSites.py misn02b --out "$RUNNER_TEMP/CRMoonSites02b.lua"
          python -I Tools/Build-MoonSites.py misn03 --depth-full 30 --out "$RUNNER_TEMP/CRMoonSites03.lua"
          diff <(tr -d '\r' < Scripts/CRMoonSites02b.lua) <(tr -d '\r' < "$RUNNER_TEMP/CRMoonSites02b.lua")
          diff <(tr -d '\r' < Scripts/CRMoonSites03.lua) <(tr -d '\r' < "$RUNNER_TEMP/CRMoonSites03.lua")
      # CR Moon weather <<

      - name: Test aiCore singleton producer recovery
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-AiCoreSingletonProducer.lua

      - name: Test aiCore state management
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-AiCoreStateManagement.lua

      - name: Test aiCore correctness fixes
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-AiCoreFixes.lua

      - name: Test aiCore human-team handling
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-AiCoreHumanTeams.lua
          "$LUA" Tools/Test-AiCoreObjectCache.lua
          python Tools/Test-AiCoreMissionContracts.py
          "$LUA" Tools/Test-PlayerPilotMode.lua
          python Tools/Test-Misn05CoopContract.py

      - name: Test weather
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          # These suites existed but were never wired in, so a weather
          # regression could reach a release with CI green.
          "$LUA" Tools/Test-CRWeatherFogHorizon.lua
          "$LUA" Tools/Test-AtmosphereIntegration.lua
          "$LUA" Tools/Test-WeatherSensors.lua
          "$LUA" Tools/Test-CRWeatherParameters.lua
          "$LUA" Tools/Test-CRVenusDenseAtmosphere.lua Scripts
          "$LUA" Tools/Test-CRMarsWeather.lua
          "$LUA" Tools/Test-CRMarsHaboob.lua
          "$LUA" Tools/Test-CRMarsVolcano.lua
          "$LUA" Tools/Test-CRTitanWeather.lua Scripts
          # The methane surface mesh, ripple map and wet masks match their generator.
          python -I Tools/Build-MethaneSurface.py --check

      - name: Test deterministic terrain clutter
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-TerrainClutter.lua Scripts

      - name: Test setup mission shell
        run: python Tools/Test-SetupMissionShell.py

      - name: Shipped cut voice-over
        run: python Tools/Test-ShippedCutVo.py

      - name: Test misn09 source port
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn09.lua
          python Tools/Test-Misn09SourceParity.py

      - name: Test early mission source audit
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-EarlyMissionFlow.lua
          python Tools/Test-EarlyMissionSourceAudit.py

      - name: Check misn13 DLL source parity
        run: python Tools/Test-Misn13SourceParity.py

      - name: Test misn13 mission transitions, co-op layer and presentation
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn13.lua
          "$LUA" Tools/Test-Misn13Coop.lua
          "$LUA" Tools/Test-Misn13Presentation.lua
          python Tools/Test-Misn13CoopContract.py
          python Tools/Test-CoopAuthoredLabels.py

      - name: Test misn14 Concept C rework, co-op layer, presentation and DLL parity
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn14.lua
          "$LUA" Tools/Test-Misn14Coop.lua
          "$LUA" Tools/Test-Misn14Presentation.lua
          python Tools/Test-Misn14SourceParity.py
          python Tools/Test-Misn14CoopContract.py

      - name: Test Mission 15 campaign co-op and methane map contract
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn15.lua
          "$LUA" Tools/Test-Misn15Coop.lua
          python Tools/Test-Misn15SourceParity.py
          python Tools/Test-Misn15CoopContract.py

      - name: Test Mission 16 evacuation and shared mission
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Test-Misn16.lua
          "$LUA" Tools/Test-Misn16Scene.lua
          "$LUA" Tools/Test-Misn16LaunchFX.lua
          python Tools/Test-Misn16SourceParity.py
          python Tools/Test-Misn16SceneMap.py

      - name: Test BlackDog08 source port
        run: |
          lua5.1 Tools/Test-BlackDog08.lua
          python Tools/Test-BlackDog08SourceParity.py
      - name: Test BlackDog07 source port
        run: |
          lua5.1 Tools/Test-BlackDog07.lua
          python Tools/Test-BlackDog07SourceParity.py
      - name: Test BlackDog01 DLL source port
        run: |
          lua5.1 Tools/Test-BlackDog01.lua
          python Tools/Test-BlackDog01SourceParity.py
      - name: Test misns8 DLL source port
        run: |
          python Tools/Test-Misns8SourceParity.py
          lua5.1 Tools/Test-Misns8.lua
      - name: Test misns7 source port
        run: |
          lua5.1 Tools/Test-Misns7.lua
          python Tools/Test-Misns7SourceParity.py
      - name: Test misns5 DLL source port
        run: |
          lua5.1 Tools/Test-Misns5.lua
          python Tools/Test-Misns5SourceParity.py
      - name: Test misn17 faithful port and co-op prototype
        run: |
          lua5.1 Tools/Test-Misn17.lua
          lua5.1 Tools/Test-Misn17Coop.lua
          lua5.1 Tools/Test-Misn17Jungle.lua
          lua5.1 Tools/Test-Misn17Crystals.lua
          python Tools/Test-Misn17SourceParity.py

      - name: Test restored Fury fighter assets and mission roster
        run: |
          python Tools/Test-FuryFighterAssets.py
          python Tools/Test-BoltMines.py
          lua5.1 Tools/Test-FuryRoster.lua

      - name: Strictly validate changed Lua 5.1 files
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LUAC="$(command -v luac5.1 || command -v luac)"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi

          # A newly touched Lua file must compile under stock Lua 5.1 even while
          # unrelated legacy missions are being migrated away from >60 upvalues.
          # This prevents adding new debt and lets each old offender be fixed and
          # runtime-tested in an isolated PR instead of one risky campaign-wide edit.
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then
              echo "Lua 5.1 strict check: $file"
              "$LUAC" -p "$file"
            fi
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- 'Scripts/**/*.lua' 'Scripts/*.lua' 'Missions/**/*.lua' 'Missions/*.lua')


      - name: Test misns1 DLL-source port
        run: |
          lua5.1 Tools/Test-Misns1.lua
          python Tools/Test-Misns1SourceParity.py
