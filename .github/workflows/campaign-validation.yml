name: Campaign Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate campaign content
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          # Full history lets the validator identify Lua files changed by the
          # PR/push and enforce Lua 5.1 strictly on newly touched mission code.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Shared model-format libraries (see AGENTS.md "Model tooling").
      # Tools/bzmodellibs.py imports them from BZ_TOOLBOX_DIR/BZ_TOOLKIT_DIR.
      # Bump the pinned commits deliberately; they are not tracked to main.
      - name: Fetch model-format libraries
        shell: bash
        env:
          TOOLBOX_SHA: ec0fce2ed83c678da5a3d5e1f935b254fb27942b
          TOOLKIT_SHA: 0a6be135092c88331d4f35b134dda69f593dcfd0
        run: |
          set -euo pipefail
          fetch() {
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "https://github.com/GrizzlyOne95/$1.git" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch Battlezone98_Modding_Toolbox "$RUNNER_TEMP/bz-toolbox" "$TOOLBOX_SHA"
          fetch BZ98RBlenderToolKit "$RUNNER_TEMP/bz-toolkit" "$TOOLKIT_SHA"
          echo "BZ_TOOLBOX_DIR=$RUNNER_TEMP/bz-toolbox" >> "$GITHUB_ENV"
          echo "BZ_TOOLKIT_DIR=$RUNNER_TEMP/bz-toolkit" >> "$GITHUB_ENV"
          echo "BZ_MODELLIBS_REQUIRED=1" >> "$GITHUB_ENV"

      # The toolkit's Ogre and GEO serializers need numpy.
      - name: Install model-library dependencies
        run: python -m pip install numpy Pillow scipy

      - name: Validate authored weapon flashes and gameplay preservation
        run: |
          python Tools/Weapons/Test-WeaponPresentation.py
          python Tools/Weapons/Test-CombatPresentation.py
          python Tools/CockpitsAndRigs/Test-WeaponRigs.py
          python Tools/UnitsAndBuildings/Test-ConstructorBuildMenu.py

      - name: Validate HD terrain bundles and normal contracts
        run: |
          python Tools/Terrain/Test-MoonHdTerrain.py
          python Tools/Terrain/Test-MarsHdTileSources.py
          python Tools/Terrain/Test-VenusHdTerrain.py
          python Tools/Terrain/Test-HdTerrainPacks.py
          python Tools/Terrain/Test-MoonCraterDisplacement.py
          python Tools/Terrain/Test-MoonRegolith.py
          python Tools/Terrain/Test-TerrainArtTuning.py
          python Tools/Terrain/Test-MoonPolyHaven.py
          python Tools/Terrain/Test-WorldSurfaceArt.py

      - name: Install Lua 5.1 compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          command -v luac5.1 || command -v luac

      - name: Validate repository invariants
        run: python Tools/Validate-CampaignRepository.py

      - name: Check shipped scripts only reference shipped repo files
        run: python Tools/Release/Test-LockedReferences.py

      - name: Test optional SAV fixture
        run: lua5.1 Tools/UnitsAndBuildings/Test-SAVPrototype.lua

      - name: Test selected content deployment
        shell: pwsh
        run: ./Tools/Release/Test-SelectedContentDeploy.ps1

      - name: Test overnight soak parsers
        shell: pwsh
        run: ./Tools/Soak/Test-OvernightSoak.ps1

      - name: Validate hangar door assets
        run: python Tools/UnitsAndBuildings/Test-HangarAssets.py

      - name: Validate L-Power fin spin and lightning shader
        run: python Tools/UnitsAndBuildings/Test-LightningPlants.py

      - name: Validate building spin and armory launch animations
        run: python Tools/UnitsAndBuildings/Test-BuildingAnimations.py

      - name: Validate unit animation slot fixes
        run: python Tools/CockpitsAndRigs/Test-UnitAnimSlots.py

      - name: Validate hardpoint mounts
        run: python Tools/CockpitsAndRigs/Test-HardpointMounts.py

      - name: Test emissive pulse reaches live surface clones
        run: lua5.1 Tools/TexturesAndSky/Test-EmissivePulse.lua

      - name: Validate combat cockpits
        run: python Tools/CockpitsAndRigs/Test-CombatCockpits.py

      - name: Validate texture revamp and Olympian interior contracts
        run: |
          python Tools/TexturesAndSky/Test-TextureRevamp.py
          python Tools/UnitsAndBuildings/Test-BuildingDetailPass.py
          python Tools/UnitsAndBuildings/Test-FactionStorage.py
          python Tools/UnitsAndBuildings/Test-FactionNavPickups.py
          python Tools/UnitsAndBuildings/Test-FactionDeathExplosions.py
          python Tools/Weapons/Test-BulletHitFx.py
          python Tools/Weapons/Test-WeaponHitFx.py
          python Tools/Weapons/Test-TrailDensity.py
          python Tools/Weapons/Test-OrdnanceModels.py
          python Tools/UnitsAndBuildings/Test-FactionPickupIntegration.py
          python Tools/UnitsAndBuildings/Test-PodUVPrototype.py

      - name: Validate cockpit revamps and Red Devil legacy skin
        run: |
          python Tools/ogrelayout.py --check
          python Tools/UnitsAndBuildings/Test-RedDevilLegacy.py
          python Tools/CockpitsAndRigs/Test-RedDevilCockpit.py
          python Tools/CockpitsAndRigs/Test-CVFighterCockpit.py
          python Tools/CockpitsAndRigs/Test-AVRocketCockpit.py
          python Tools/CockpitsAndRigs/Test-CVBomberCockpit.py
          python Tools/CockpitsAndRigs/Test-ScoutCockpits.py
          python Tools/CockpitsAndRigs/Test-WalkerCockpits.py
          python Tools/CockpitsAndRigs/Test-CVHeavyCockpit.py
          python Tools/CockpitsAndRigs/Test-BomberRocketCockpits.py
          python Tools/CockpitsAndRigs/Test-LightWalkerCockpits.py
          python Tools/CockpitsAndRigs/Test-CockpitSections.py

      - name: Audit looping model animations
        # bvwalk.vdf is an older walker fix whose cycles still seam (reported, not owned here).
        # svwalk/cvwalk keep the stock loop seams on purpose: the fix only smooths
        # in-cycle twitch keys, and the audit reports the same 56 findings on the stock VDFs.
        # hvwalk (Fury Walker) has no seam or skipframe; its only findings are seamvel on the left leg,
        # because its cycle starts at the left foot's touchdown, a velocity corner every step has.
        run: python Tools/CockpitsAndRigs/Audit-SdfLoops.py Assets/ModelFixes --strict --exclude bvwalk --exclude svwalk --exclude cvwalk --exclude hvwalk

      - name: Test BlackDog09 source port
        run: |
          lua5.1 Tools/CoopCampaignTests/Test-BlackDog09.lua
          python Tools/CoopCampaignTests/Test-BlackDog09SourceParity.py

      - name: Test Chinese08 source port
        run: |
          lua5.1 Tools/CoopCampaignTests/Test-Chinese08.lua
          python Tools/CoopCampaignTests/Test-Chinese08SourceParity.py

      - name: Test misn12 source port and Lua comment scanning
        run: |
          lua5.1 Tools/MissionTests/Test-Misn12.lua
          python Tools/Release/Test-LuaCommentScan.py

      - name: Check generated GoombaBZ transcripts
        run: python Tools/Release/Import-GoombaTranscripts.py --check

      - name: Report legacy Lua 5.1 compatibility debt
        shell: bash
        run: |
          set -uo pipefail
          LUAC="$(command -v luac5.1 || command -v luac)"
          failed=0
          while IFS= read -r -d '' file; do
            output=""
            if ! output="$($LUAC -p "$file" 2>&1)"; then
              # BZR inherits Lua 5.1's 60-upvalue ceiling. Existing legacy
              # offenders remain visible while they are repaired in focused PRs;
              # all other compiler failures are blocking immediately.
              if grep -Fq "has more than 60 upvalues" <<<"$output"; then
                echo "::warning file=$file::$output"
              else
                echo "$output" >&2
                failed=1
              fi
            fi
          done < <(find Scripts Missions -type f -iname '*.lua' -print0 2>/dev/null || true)
          exit "$failed"

      - name: Test OpenShim installer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Release/Test-OpenShimInstallerDiagnostics.lua

      - name: Test CR co-op helpers
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/RuntimeTests/Test-CRCoop.lua
          "$LUA" Tools/RuntimeTests/Test-CRTeamSkins.lua
          "$LUA" Tools/RuntimeTests/Test-CRWire.lua
          "$LUA" Tools/RuntimeTests/Test-CRCoopComms.lua
          "$LUA" Tools/RuntimeTests/Test-CRCoopAssist.lua
          "$LUA" Tools/RuntimeTests/Test-CRCoopPda.lua
          "$LUA" Tools/RuntimeTests/Test-CRCoopTeamStrip.lua
          "$LUA" Tools/RuntimeTests/Test-CRCoopPartnerBars.lua
          "$LUA" Tools/RuntimeTests/Test-CRCoopDiagnostics.lua
          "$LUA" Tools/RuntimeTests/Test-CRHudLayout.lua
          "$LUA" Tools/RuntimeTests/Test-CoopNetworkInput.lua
          "$LUA" Tools/Release/Test-SubtitleReplacement.lua

      - name: Test world lighting and sky ownership
        run: lua5.1 Tools/TexturesAndSky/Test-CRWorldArt.lua

      - name: Test misn02b co-op map and shipping contract
        run: python Tools/MissionTests/Test-Misn02bCoopContract.py

      - name: Test misn02b co-op execution and peer transport model
        run: |
          lua5.1 Tools/RuntimeTests/Test-BZRPeerTransport.lua
          lua5.1 Tools/MissionTests/Test-Misn02bCoop.lua

      - name: Test misn03 co-op team contract
        run: python Tools/MissionTests/Test-Misn03CoopContract.py

      - name: Test misn03 offline and co-op mission execution
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn03Coop.lua

      - name: Test misn03 NSDF rocket launch (film, exhaust, presentation, assets)
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn03LaunchFX.lua
          "$LUA" Tools/MissionTests/Test-Misn03LaunchFilm.lua
          "$LUA" Tools/MissionTests/Test-Misn03Launch.lua
          python Tools/MissionTests/Test-Misn03RocketAssets.py

      - name: Test misn04 co-op scaffold and complete mission
        run: |
          python Tools/MissionTests/Test-Misn04CoopContract.py
          lua5.1 Tools/MissionTests/Test-Misn04Coop.lua
          lua5.1 Tools/MissionTests/Test-CR04Drop.lua
          lua5.1 Tools/RuntimeTests/Test-CRDropIn.lua
          lua5.1 Tools/RuntimeTests/Test-CRDropFX.lua

      - name: Test misn10 source-faithful port
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn10.lua
          python Tools/MissionTests/Test-Misn10SourceParity.py

      - name: Test misn11 source port, co-op layer and presentation
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn11.lua
          "$LUA" Tools/MissionTests/Test-Misn11Coop.lua
          "$LUA" Tools/MissionTests/Test-Misn11Presentation.lua
          python Tools/MissionTests/Test-Misn11SourceParity.py
          python Tools/MissionTests/Test-Misn11CoopContract.py
          python Tools/MissionTests/Test-CoopAuthoredLabels.py

      - name: Test Mars rocket film and exhaust lifecycle
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn06.lua
          "$LUA" Tools/MissionTests/Test-Misn06Presentation.lua
          "$LUA" Tools/MissionTests/Test-Misn06LaunchFilm.lua
          "$LUA" Tools/MissionTests/Test-Misn06LaunchFX.lua
          python Tools/MissionTests/Test-Misn06RocketAssets.py
          python Tools/MissionTests/Test-Misn06SourceParity.py
          python Tools/MissionTests/Test-Misn06CoopContract.py

      - name: Test per-world geyser effects
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/TexturesAndSky/Test-CRGeysers.lua Scripts

      - name: Test misn12 source port, co-op layer, presentation and Europa weather
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn12.lua
          "$LUA" Tools/MissionTests/Test-Misn12Coop.lua
          "$LUA" Tools/MissionTests/Test-Misn12Presentation.lua
          "$LUA" Tools/TexturesAndSky/Test-CREuropaWeather.lua
          python Tools/MissionTests/Test-Misn12SourceParity.py
          python Tools/MissionTests/Test-Misn12CoopContract.py

      # CR Moon weather >>
      - name: Test Moon weather director (misn02b / misn03)
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/TexturesAndSky/Test-CRMoonWeather.lua Scripts
          # The generated map data must match what the generator produces from the shipped terrain.
          python -I Tools/Terrain/Build-MoonSites.py misn02b --out "$RUNNER_TEMP/CRMoonSites02b.lua"
          python -I Tools/Terrain/Build-MoonSites.py misn03 --depth-full 30 --out "$RUNNER_TEMP/CRMoonSites03.lua"
          diff <(tr -d '\r' < Scripts/CRMoonSites02b.lua) <(tr -d '\r' < "$RUNNER_TEMP/CRMoonSites02b.lua")
          diff <(tr -d '\r' < Scripts/CRMoonSites03.lua) <(tr -d '\r' < "$RUNNER_TEMP/CRMoonSites03.lua")
      # CR Moon weather <<

      - name: Test shared vehicle wakes (CRWake) and the directors that use it
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/TexturesAndSky/Test-VehicleWakes.lua Scripts

      - name: Test aiCore singleton producer recovery
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/RuntimeTests/Test-AiCoreSingletonProducer.lua

      - name: Test aiCore state management
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/RuntimeTests/Test-AiCoreStateManagement.lua

      - name: Test aiCore correctness fixes
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/RuntimeTests/Test-AiCoreFixes.lua

      - name: Test aiCore human-team handling
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/RuntimeTests/Test-AiCoreHumanTeams.lua
          "$LUA" Tools/RuntimeTests/Test-AiCoreObjectCache.lua
          python Tools/MissionTests/Test-AiCoreMissionContracts.py
          "$LUA" Tools/UnitsAndBuildings/Test-PlayerPilotMode.lua
          python Tools/MissionTests/Test-Misn05CoopContract.py

      - name: Test weather
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          # These suites existed but were never wired in, so a weather
          # regression could reach a release with CI green.
          "$LUA" Tools/TexturesAndSky/Test-CRWeatherFogHorizon.lua
          "$LUA" Tools/TexturesAndSky/Test-AtmosphereIntegration.lua
          "$LUA" Tools/TexturesAndSky/Test-WeatherSensors.lua
          "$LUA" Tools/TexturesAndSky/Test-CRWeatherParameters.lua
          "$LUA" Tools/TexturesAndSky/Test-CRVenusDenseAtmosphere.lua Scripts
          "$LUA" Tools/TexturesAndSky/Test-CRElysiumWeather.lua Scripts
          "$LUA" Tools/TexturesAndSky/Test-CRMarsWeather.lua
          "$LUA" Tools/TexturesAndSky/Test-CRWetGlassWeather.lua Scripts
          "$LUA" Tools/TexturesAndSky/Test-CRMarsHaboob.lua
          "$LUA" Tools/TexturesAndSky/Test-CRMarsVolcano.lua
          "$LUA" Tools/TexturesAndSky/Test-CRTitanWeather.lua Scripts
          "$LUA" Tools/TexturesAndSky/Test-CRFoliageWind.lua Scripts
            "$LUA" Tools/TexturesAndSky/Test-CRFloraDamage.lua
            "$LUA" Tools/TexturesAndSky/Test-CRFloraAdapters.lua
            "$LUA" Tools/TexturesAndSky/Test-CRFloraDamageStress.lua
          "$LUA" Tools/Weapons/Test-CRShieldTowerFX.lua Scripts
          # Mission 18 storm: director, tornado, ground, replication, payload lint.
          "$LUA" Tools/RuntimeTests/Test-CRStorm18.lua
          "$LUA" Tools/RuntimeTests/Test-CRStorm18Fissures.lua
          "$LUA" Tools/RuntimeTests/Test-CRStorm18Trees.lua
          python Tools/MissionBuild/Build-Misn18Trees.py --check
          python -I Tools/MissionBuild/Build-Misn18Storm.py --check
          python -I Tools/MissionBuild/Build-Misn18Water.py --check
          # The wind foliage material is generated from cr17_surface.material.
          python -I Tools/TexturesAndSky/Build-FoliageWindMaterial.py --check
          # The methane surface mesh, ripple map and wet masks match their generator.
          python -I Tools/Terrain/Build-MethaneSurface.py --check

      - name: Test deterministic terrain clutter
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/Terrain/Test-TerrainClutter.lua Scripts

      - name: Test setup mission shell
        run: python Tools/MissionTests/Test-SetupMissionShell.py

      - name: Test native campaign co-op vehicle lists
        run: python Tools/MissionTests/Test-CoopVehicleLists.py

      - name: Shipped cut voice-over
        run: python Tools/Release/Test-ShippedCutVo.py

      - name: Test misn09 source port
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn09.lua
          python Tools/MissionTests/Test-Misn09SourceParity.py

      - name: Test early mission source audit
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-EarlyMissionFlow.lua
          python Tools/MissionTests/Test-EarlyMissionSourceAudit.py

      - name: Check misn13 DLL source parity
        run: python Tools/MissionTests/Test-Misn13SourceParity.py

      - name: Test misn13 mission transitions, co-op layer and presentation
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn13.lua
          "$LUA" Tools/MissionTests/Test-Misn13Coop.lua
          "$LUA" Tools/MissionTests/Test-Misn13Presentation.lua
          python Tools/MissionTests/Test-Misn13CoopContract.py
          python Tools/MissionTests/Test-CoopAuthoredLabels.py

      - name: Test misn14 Concept C rework, co-op layer, presentation and DLL parity
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn14.lua
          "$LUA" Tools/MissionTests/Test-Misn14Coop.lua
          "$LUA" Tools/MissionTests/Test-Misn14Presentation.lua
          python Tools/MissionTests/Test-Misn14SourceParity.py
          python Tools/MissionTests/Test-Misn14CoopContract.py

      - name: Test Mission 15 campaign co-op and methane map contract
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn15.lua
          "$LUA" Tools/MissionTests/Test-Misn15Coop.lua
          python Tools/MissionTests/Test-Misn15SourceParity.py
          python Tools/MissionTests/Test-Misn15CoopContract.py

      - name: Test Mission 16 evacuation and shared mission
        shell: bash
        run: |
          set -euo pipefail
          LUA="$(command -v lua5.1 || command -v lua)"
          "$LUA" Tools/MissionTests/Test-Misn16.lua
          "$LUA" Tools/MissionTests/Test-Misn16Scene.lua
          "$LUA" Tools/MissionTests/Test-Misn16LaunchFX.lua
          python Tools/MissionTests/Test-Misn16SourceParity.py
          python Tools/MissionTests/Test-Misn16SceneMap.py

      - name: Test BlackDog08 source port
        run: |
          lua5.1 Tools/CoopCampaignTests/Test-BlackDog08.lua
          python Tools/CoopCampaignTests/Test-BlackDog08SourceParity.py
      - name: Test BlackDog07 source port
        run: |
          lua5.1 Tools/CoopCampaignTests/Test-BlackDog07.lua
          python Tools/CoopCampaignTests/Test-BlackDog07SourceParity.py
      - name: Test BlackDog01 DLL source port
        run: |
          lua5.1 Tools/CoopCampaignTests/Test-BlackDog01.lua
          python Tools/CoopCampaignTests/Test-BlackDog01SourceParity.py
      - name: Test misns8 DLL source port
        run: |
          python Tools/MissionTests/Test-Misns8SourceParity.py
          lua5.1 Tools/MissionTests/Test-Misns8.lua
      - name: Test misns7 source port
        run: |
          lua5.1 Tools/MissionTests/Test-Misns7.lua
          python Tools/MissionTests/Test-Misns7SourceParity.py
      - name: Test misns5 DLL source port
        run: |
          lua5.1 Tools/MissionTests/Test-Misns5.lua
          python Tools/MissionTests/Test-Misns5SourceParity.py
      - name: Test misn17 faithful port and co-op prototype
        run: |
          lua5.1 Tools/MissionTests/Test-Misn17.lua
          lua5.1 Tools/MissionTests/Test-Misn17Coop.lua
          lua5.1 Tools/MissionTests/Test-Misn17Jungle.lua
          lua5.1 Tools/MissionTests/Test-Misn17Crystals.lua
          python Tools/MissionTests/Test-Misn17SourceParity.py
      - name: Test misn18 faithful port, co-op layer and map contract
        run: |
          lua5.1 Tools/MissionTests/Test-Misn18.lua
          lua5.1 Tools/MissionTests/Test-Misn18Coop.lua
          python Tools/MissionTests/Test-Misn18SourceParity.py
          python Tools/MissionTests/Test-Misn18CoopContract.py

      - name: Test restored Fury fighter assets and mission roster
        run: |
          python Tools/UnitsAndBuildings/Test-FuryFighterAssets.py
          python Tools/Weapons/Test-BoltMines.py
          lua5.1 Tools/UnitsAndBuildings/Test-FuryRoster.lua

      - name: Strictly validate changed Lua 5.1 files
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LUAC="$(command -v luac5.1 || command -v luac)"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi

          # A newly touched Lua file must compile under stock Lua 5.1 even while
          # unrelated legacy missions are being migrated away from >60 upvalues.
          # This prevents adding new debt and lets each old offender be fixed and
          # runtime-tested in an isolated PR instead of one risky campaign-wide edit.
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then
              echo "Lua 5.1 strict check: $file"
              "$LUAC" -p "$file"
            fi
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- 'Scripts/**/*.lua' 'Scripts/*.lua' 'Missions/**/*.lua' 'Missions/*.lua')


      - name: Test misns1 DLL-source port
        run: |
          lua5.1 Tools/MissionTests/Test-Misns1.lua
          python Tools/MissionTests/Test-Misns1SourceParity.py
      - name: Test misns1 co-op layer, presentation and map contract
