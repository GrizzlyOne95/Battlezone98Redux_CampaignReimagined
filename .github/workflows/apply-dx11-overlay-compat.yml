name: Apply DX11 overlay compatibility wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dx11-overlay-fix-final2
          fetch-depth: 0

      - name: Regenerate programmable overlay panel materials
        run: python Tools/Generate-PdaOverlayMaterials.py

      - name: Wire shader-backed font material into Ogre TextArea overlays
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          subtitles = Path('Scripts/ScriptSubtitles.lua')
          replace_once(
              subtitles,
              'local OVERLAY_FONT_NAME = "CRBZoneOverlayFont"\n',
              'local OVERLAY_FONT_NAME = "CRBZoneOverlayFont"\nlocal OVERLAY_FONT_MATERIAL = "CR_OverlayFont"\n',
          )
          replace_once(
              subtitles,
              '    Call(exu.HideOverlay, ids.overlay)\n\n    if not ok then\n        overlayState.failed = true\n',
              '    Call(exu.HideOverlay, ids.overlay)\n\n'
              '    -- Ogre 1.10 image fonts create a fixed-function material internally.\n'
              '    -- D3D11 has no fixed pipeline, so replace it after font binding with\n'
              '    -- the explicit shader-backed atlas material.\n'
              '    if fontName then\n'
              '        Call(exu.SetOverlayMaterial, ids.text, OVERLAY_FONT_MATERIAL)\n'
              '    end\n\n'
              '    if not ok then\n        overlayState.failed = true\n',
          )

          persistent = Path('Scripts/PersistentConfig.lua')
          replace_once(
              persistent,
              '    SafeCall(exu.HideOverlay, ids.overlay)\n\n    if not ok then\n        state.failed = true\n',
              '    SafeCall(exu.HideOverlay, ids.overlay)\n\n'
              '    -- TextArea font binding installs Ogre 1.10\'s fixed-function font\n'
              '    -- material. Rebind all custom-font text elements to the shader-backed\n'
              '    -- atlas material so D3D11 always has both VS and PS programs.\n'
              '    if state.useCustomFont and type(exu.SetOverlayMaterial) == "function" then\n'
              '        for _, textId in ipairs(textIds) do\n'
              '            if textId then\n'
              '                SafeCall(exu.SetOverlayMaterial, textId, "CR_OverlayFont")\n'
              '            end\n'
              '        end\n'
              '    end\n\n'
              '    if not ok then\n        state.failed = true\n',
          )
          replace_once(
              persistent,
              '    if ok then\n        PersistentConfig.ExperimentalOverlayReady = true\n',
              '    if PersistentConfig.ExperimentalOverlayUseCustomFont and type(exu.SetOverlayMaterial) == "function" then\n'
              '        SafeCall(exu.SetOverlayMaterial, ids.text, "CR_OverlayFont")\n'
              '    end\n\n'
              '    if ok then\n        PersistentConfig.ExperimentalOverlayReady = true\n',
          )

      - name: Extend SM4 shader validation
        shell: python
        run: |
          from pathlib import Path

          path = Path('Tools/Validate-DX11Shaders.ps1')
          text = path.read_text(encoding='utf-8')

          old = "$terrainShader = Join-Path $repoRoot 'Shaders\\CR_terrain-sm4.hlsl'\n"
          new = old + "$uiShader = Join-Path $repoRoot 'Shaders\\CR_ui-sm4.hlsl'\n$overlayShader = Join-Path $repoRoot 'Shaders\\CR_overlay-sm4.hlsl'\n"
          if text.count(old) != 1:
              raise RuntimeError('validator: terrain shader declaration match failed')
          text = text.replace(old, new, 1)

          marker = "$cases = @(\n"
          cases = """$cases = @(\n    @{\n        Name = 'ui-vs-sm4'\n        File = $uiShader\n        Entry = 'ui_vertex'\n        Target = 'vs_4_0'\n        Defines = @()\n    },\n    @{\n        Name = 'ui-ps-sm4'\n        File = $uiShader\n        Entry = 'ui_fragment'\n        Target = 'ps_4_0'\n        Defines = @()\n    },\n    @{\n        Name = 'overlay-ps-tint'\n        File = $overlayShader\n        Entry = 'overlay_tint_fragment'\n        Target = 'ps_4_0'\n        Defines = @()\n    },\n"""
          if text.count(marker) != 1:
              raise RuntimeError('validator: cases marker match failed')
          text = text.replace(marker, cases, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Structural checks
        shell: python
        run: |
          from pathlib import Path

          material = Path('Materials/cr_pda_overlay.material').read_text(encoding='utf-8')
          assert material.count('material CRPda') == 315
          assert material.count('fragment_program_ref CR_OverlayTint_fragmentHLSL4') == 315
          assert material.count('colour_op_ex source1 src_manual src_current') == 315
          assert 'material CRPdaBackdrop_DG_A00' in material
          assert 'param_named overlayColor float4 0.0170 0.0330 0.0170 0.2200' in material
          assert 'material CRPdaBorder_R_A20' in material

          subtitles = Path('Scripts/ScriptSubtitles.lua').read_text(encoding='utf-8')
          persistent = Path('Scripts/PersistentConfig.lua').read_text(encoding='utf-8')
          assert 'OVERLAY_FONT_MATERIAL = "CR_OverlayFont"' in subtitles
          assert 'SetOverlayMaterial, ids.text, OVERLAY_FONT_MATERIAL' in subtitles
          assert persistent.count('"CR_OverlayFont"') >= 2

          validator = Path('Tools/Validate-DX11Shaders.ps1').read_text(encoding='utf-8')
          assert "Name = 'overlay-ps-tint'" in validator
          print('DX11 overlay compatibility structural checks passed.')

      - name: Commit generated wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Materials/cr_pda_overlay.material Scripts/PersistentConfig.lua Scripts/ScriptSubtitles.lua Tools/Validate-DX11Shaders.ps1
          git commit -m "fix: make EXU overlays programmable on DX11"
          git push origin HEAD:agent/dx11-overlay-fix-final2
