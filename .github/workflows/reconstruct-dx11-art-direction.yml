name: Reconstruct DX11 fog and lunar art direction

on:
  push:
    branches:
      - agent/dx11-fog-lunar-art-direction-v2

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out current-main reconstruction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Three-way port only the qualified shader experiment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldCommit = 'd50606066b23164575443455b69d92d76f233a02'
          git fetch origin agent/dx11-lighting-art-direction --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch retired DX11 branch.' }

          $parent = (git rev-parse "$oldCommit^").Trim()
          git diff --binary $parent $oldCommit -- `
            Shaders/CR_base-sm4.hlsl `
            Shaders/CR_terrain-sm4.hlsl `
            Tools/Validate-DX11Shaders.ps1 > dx11-art-direction.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not build focused DX11 patch.' }

          git apply --3way --index dx11-art-direction.patch
          if ($LASTEXITCODE -ne 0) {
            git status --short
            throw 'Current shader evolution conflicts with the old experiment; refusing a stale-file transplant.'
          }
          Remove-Item -LiteralPath dx11-art-direction.patch -Force

          $baseShader = Get-Content -LiteralPath 'Shaders/CR_base-sm4.hlsl' -Raw
          $terrainShader = Get-Content -LiteralPath 'Shaders/CR_terrain-sm4.hlsl' -Raw
          $validator = Get-Content -LiteralPath 'Tools/Validate-DX11Shaders.ps1' -Raw

          if ($baseShader -notmatch 'authoredFog\s*=\s*srgb_to_linear\(authoredFog\)') {
            throw 'Base shader did not acquire the qualified authored-fog decode.'
          }
          if ($terrainShader -notmatch 'authoredFog\s*=\s*srgb_to_linear\(authoredFog\)' -or
              $terrainShader -notmatch 'terrain_ibl_diffuse_strength' -or
              $terrainShader -notmatch 'CR_TERRAIN_IBL_AIRLESS_FLOOR\s*=\s*0\.15') {
            throw 'Terrain shader did not acquire the qualified lunar diffuse-IBL correction.'
          }
          if ($validator -notmatch 'authoredFog' -or $validator -notmatch 'CR_TERRAIN_IBL_REFERENCE_FOG_RANGE') {
            throw 'DX11 validator did not acquire the matching safety assertions.'
          }

      - name: Document the current-main reconstruction
        shell: pwsh
        run: |
          $doc = @'
          # DX11 Fog / Lunar Art-Direction Reconstruction

          This branch reconstructs only the still-relevant portion of retired
          `agent/dx11-lighting-art-direction` commit `d506060` on current `main`.
          No earlier light-budget branch history is carried forward.

          ## Changes

          - Mission-authored `fogColour` is explicitly classified as display RGB
            and decoded before Enhanced linear-space atmosphere composition, so
            the final output transfer does not encode the fog colour twice.
          - Terrain diffuse IBL is scaled by continuous authored fog-range support.
            Airless/very-long-range scenes retain a 0.15 floor instead of the full
            neutral diffuse environment fill; object IBL, specular IBL, direct
            lights and emissives are unchanged.
          - The DX11 source validator requires the fog decode, confines the
            atmosphere-support correction to terrain diffuse irradiance, and
            rejects accidental propagation into the base/object shader.

          ## Scope

          This is an Enhanced DX11 art-direction correction only. Default, Retro,
          DX9/GL, object diffuse IBL, all specular IBL, direct lighting, emissives,
          material semantics and PSSM ownership remain unchanged.

          Automated shader validation is run during reconstruction and again by
          the normal DX11 PR workflow. Locked-camera Mars/Moon visual comparison
          remains the final human acceptance gate before merge.
          '@
          $doc = ($doc -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'Docs\DX11_FOG_LUNAR_ART_DIRECTION_RECONSTRUCTION.md'),
            $doc + "`r`n",
            [System.Text.UTF8Encoding]::new($false))

      - name: Compile representative DX11 SM4 variants
        shell: powershell
        run: .\Tools\Validate-DX11Shaders.ps1

      - name: Verify validator mutation guards
        shell: powershell
        run: .\Tools\Test-DX11ShaderValidator.ps1

      - name: Validate Enhanced PSSM v2 remains intact
        shell: powershell
        run: .\Tools\Test-EnhancedPssmV2.ps1

      - name: Commit reconstructed work and remove bootstrap workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -- '.github/workflows/reconstruct-dx11-art-direction.yml'
          git add -- `
            'Shaders/CR_base-sm4.hlsl' `
            'Shaders/CR_terrain-sm4.hlsl' `
            'Tools/Validate-DX11Shaders.ps1' `
            'Docs/DX11_FOG_LUNAR_ART_DIRECTION_RECONSTRUCTION.md'

          git status --short | ForEach-Object { Write-Host $_ }
          git commit -m 'fix(dx11): reconstruct fog color and lunar terrain contrast'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit reconstructed DX11 work.' }
          git push origin HEAD:agent/dx11-fog-lunar-art-direction-v2
          if ($LASTEXITCODE -ne 0) { throw 'Could not push reconstructed DX11 branch.' }
