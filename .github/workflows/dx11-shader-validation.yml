name: DX11 Shader Validation

on:
  pull_request:
    paths:
      - 'Shaders/**'
      - 'Materials/**'
      - 'Tools/Validate-DX11Shaders.ps1'
      - 'Docs/DX11_COLOR_SPACE_AUDIT.md'
      - '.github/workflows/dx11-shader-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sm4:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile representative DX11 SM4 variants
        shell: powershell
        run: .\Tools\Validate-DX11Shaders.ps1
