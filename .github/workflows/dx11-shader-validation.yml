name: DX11 Shader Validation

on:
  pull_request:
    paths:
      - 'Shaders/**'
      - 'Materials/**'
      - 'Tools/Validate-DX11Shaders.ps1'
      - 'Tools/Test-DX11ShaderValidator.ps1'
      - 'Tools/Compare-DX11ShaderBinaries.ps1'
      - 'Tools/Build-EnhancedMaterialMap.py'
      - 'Tools/Test-EnhancedMaterialV2.py'
      - 'Docs/DX11_COLOR_SPACE_AUDIT.md'
      - 'Docs/DX11_ENHANCED_ATMOSPHERE.md'
      - 'Docs/DX11_ENHANCED_MATERIAL_V2.md'
      - '.github/workflows/dx11-shader-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sm4:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # Full history: the binary comparison below needs the PR base revision
        # available locally to materialize a baseline tree.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python material-tool tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install material-tool dependency
        shell: powershell
        run: python -m pip install Pillow==11.3.0

      - name: Validate Enhanced Material V2 math and packing
        shell: powershell
        run: python .\Tools\Test-EnhancedMaterialV2.py

      - name: Compile representative DX11 SM4 variants
        shell: powershell
        run: .\Tools\Validate-DX11Shaders.ps1

      # A guard that only ever passes proves nothing. This asserts the guards
      # actually reject the regressions they claim to.
      - name: Verify the validator rejects known regressions
        shell: powershell
        run: .\Tools\Test-DX11ShaderValidator.ps1

      # Enhanced-only work must leave Default and Retro bytecode untouched.
      # Bit-identical DXBC is a stronger statement than any visual check.
      - name: Assert Default/Retro DXBC is unchanged
        shell: powershell
        run: |
          .\Tools\Compare-DX11ShaderBinaries.ps1 `
            -BaselineRef "origin/${{ github.base_ref }}" `
            -RequireLegacyIdentical
