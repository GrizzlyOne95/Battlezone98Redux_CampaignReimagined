name: Apply temporary IBL debug visualization

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'debug/dx11-ibl-visualization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch DX11 SM4 IBL debug marker
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('Shaders/CR_base-sm4.hlsl'),
              Path('Shaders/CR_terrain-sm4.hlsl'),
          ]

          define_block = """\n// TEMPORARY DIAGNOSTIC: when enabled, any pixel using the static IBL path is\n// strongly tinted magenta after normal lighting/fog. Remove after runtime proof.\n#ifndef CR_IBL_DEBUG_VISUALIZE\n#define CR_IBL_DEBUG_VISUALIZE 1\n#endif\n"""

          for path in files:
              text = path.read_text(encoding='utf-8')

              if '#define CR_IBL_DEBUG_VISUALIZE 1' not in text:
                  anchor = '#if defined(OG_RETRO_MODE)\n'
                  if anchor not in text:
                      raise RuntimeError(f'header anchor missing in {path}')
                  text = text.replace(anchor, define_block + '\n' + anchor, 1)

              if 'TEMP IBL DEBUG MARKER' not in text:
                  if path.name == 'CR_base-sm4.hlsl':
                      anchor = '    oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);\n    oColor.a = saturate(transparency);\n'
                      replacement = """    oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);\n\n#if defined(IBL_ENABLED) && CR_IBL_DEBUG_VISUALIZE\n    // TEMP IBL DEBUG MARKER: unmistakable proof that the Enhanced-High IBL\n    // shader variant is actually drawing this pixel.\n    oColor.xyz = lerp(oColor.xyz, float3(1.0, 0.0, 1.0), 0.85);\n#endif\n\n    oColor.a = saturate(transparency);\n"""
                  else:
                      anchor = '    oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);\n    oColor.a = vColor.a;\n'
                      replacement = """    oColor.xyz = lerp(oColor.xyz, fogColour.xyz, fogValue);\n\n#if defined(IBL_ENABLED) && CR_IBL_DEBUG_VISUALIZE\n    // TEMP IBL DEBUG MARKER: unmistakable proof that the Enhanced-High IBL\n    // shader variant is actually drawing this pixel.\n    oColor.xyz = lerp(oColor.xyz, float3(1.0, 0.0, 1.0), 0.85);\n#endif\n\n    oColor.a = vColor.a;\n"""
                  if anchor not in text:
                      raise RuntimeError(f'output anchor missing in {path}')
                  text = text.replace(anchor, replacement, 1)

              path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit diagnostic shader changes
        shell: bash
        run: |
          if git diff --quiet -- Shaders/CR_base-sm4.hlsl Shaders/CR_terrain-sm4.hlsl; then
            echo "No shader changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shaders/CR_base-sm4.hlsl Shaders/CR_terrain-sm4.hlsl
          git commit -m "debug: visualize active DX11 IBL path"
          git push origin HEAD:${{ github.head_ref }}
